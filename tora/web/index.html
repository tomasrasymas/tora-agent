<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TORA · Personal Assistant</title>
    <style>
      :root {
        --bg: #0e0f12;
        --text: #f2f3f5;
        --muted: #8a8f99;
        --surface: #1b1e24;
        --composer-bg: #16181d;
        --composer-border: #2a2f37;
        --pill-bg: #21252c;
        --pill-border: #313742;
        --accent: #c8ff00;
        --accent-text: #0e0f12;
        --send-bg: #2a2f37;
        --send-bg-active: var(--accent);
        --user-bubble: #21252c;
      }
      * { box-sizing: border-box; }
      html { height: 100%; -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        /* Dynamic viewport height; JS overrides with the exact visible height
           so the composer stays above the iOS keyboard. */
        height: 100vh;
        height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: row;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      /* Layout: a conversations sidebar beside the content column. */
      #content {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #sidebar {
        width: 264px;
        flex-shrink: 0;
        height: 100%;
        background: var(--surface);
        border-right: 1px solid var(--composer-border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #newChat {
        margin: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        background: var(--pill-bg);
        border: 1px solid var(--pill-border);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        text-align: left;
      }
      #convList {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 12px;
      }
      .conv {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 9px 10px;
        margin-bottom: 2px;
        border-radius: 9px;
        cursor: pointer;
      }
      .conv:hover,
      .conv.active {
        background: var(--pill-bg);
      }
      .conv .meta {
        flex: 1;
        min-width: 0;
      }
      .conv .t {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv .when {
        margin-top: 1px;
        font-size: 11px;
        color: var(--muted);
      }
      .conv .del {
        border: none;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        opacity: 0;
        flex-shrink: 0;
      }
      .conv:hover .del {
        opacity: 1;
      }
      #sidebarToggle {
        display: none;
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 30;
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: var(--surface);
        border: 1px solid var(--composer-border);
        color: var(--text);
        cursor: pointer;
        align-items: center;
        justify-content: center;
      }
      @media (max-width: 720px) {
        #sidebar {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          z-index: 25;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
        }
        body.sidebar-open #sidebar {
          transform: translateX(0);
        }
        #sidebarToggle {
          display: flex;
        }
      }

      /* Scroll region: holds the centered empty-state stage, and once chatting,
         the message list. */
      #scroller {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }

      /* Empty state: greeting + composer vertically centered together. */
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 24px max(20px, env(safe-area-inset-left)) 24px max(20px, env(safe-area-inset-right));
      }
      body.chatting .stage { display: none; }

      #hero { text-align: center; margin-bottom: 34px; }
      #hero h1 {
        margin: 0 0 10px;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      #hero h1 .accent { color: var(--accent); }
      #hero p {
        margin: 0;
        font-size: 20px;
        color: var(--muted);
      }

      /* Message list (chat mode). */
      #messages {
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        padding: 28px max(20px, env(safe-area-inset-left)) 16px max(20px, env(safe-area-inset-right));
        display: none;
      }
      body.chatting #messages { display: block; }

      .msg { display: flex; flex-direction: column; margin-bottom: 22px; }
      .msg.user { align-items: flex-end; }
      .msg.assistant { align-items: flex-start; }
      .msg .bubble { white-space: pre-wrap; word-wrap: break-word; }
      .msg.user .bubble {
        background: var(--user-bubble);
        padding: 11px 16px;
        border-radius: 18px;
        max-width: 80%;
      }
      .msg.assistant .bubble { max-width: 100%; }
      .msg.assistant .bubble.thinking { color: var(--muted); }

      /* Rendered markdown (assistant answers). */
      .bubble.md { white-space: normal; }
      .bubble.md > :first-child { margin-top: 0; }
      .bubble.md > :last-child { margin-bottom: 0; }
      .bubble.md p { margin: 0 0 0.7em; }
      .bubble.md h1, .bubble.md h2, .bubble.md h3,
      .bubble.md h4, .bubble.md h5, .bubble.md h6 {
        margin: 0.8em 0 0.35em; line-height: 1.25;
      }
      .bubble.md ul, .bubble.md ol { margin: 0.3em 0 0.7em; padding-left: 1.4em; }
      .bubble.md li { margin: 0.15em 0; }
      .bubble.md code {
        background: var(--pill-bg);
        padding: 0.1em 0.35em; border-radius: 5px;
        font-size: 0.9em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .bubble.md pre {
        background: var(--surface); border: 1px solid var(--composer-border);
        padding: 0.75em 0.9em; border-radius: 10px; overflow-x: auto;
      }
      .bubble.md pre code { background: none; padding: 0; font-size: 0.85em; }
      .bubble.md a { color: var(--accent); text-decoration: underline; }
      .bubble.md table {
        border-collapse: collapse; margin: 0.5em 0; max-width: 100%;
      }
      .bubble.md th, .bubble.md td {
        border: 1px solid var(--composer-border);
        padding: 0.45em 0.7em; text-align: left; vertical-align: top;
      }
      .bubble.md th { background: var(--pill-bg); font-weight: 600; }

      .reasoning {
        max-width: 100%;
        margin-bottom: 10px;
        border: 1px solid var(--composer-border);
        border-radius: 14px;
        overflow: hidden;
      }
      .reasoning summary {
        padding: 7px 14px;
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
        user-select: none;
        list-style: none;
      }
      .reasoning summary::-webkit-details-marker { display: none; }
      .reasoning summary::before { content: "▸ "; }
      .reasoning[open] summary::before { content: "▾ "; }
      .reasoning .body {
        padding: 0 14px 10px;
        color: var(--muted);
        font-size: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      /* Tool call card. */
      .tool {
        max-width: 100%;
        margin-bottom: 10px;
        border: 1px solid var(--composer-border);
        border-radius: 14px;
        overflow: hidden;
        font-size: 13px;
      }
      .tool > summary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        list-style: none;
      }
      .tool > summary::-webkit-details-marker { display: none; }
      .tool > summary::before { content: "🔧 ▸"; font-weight: 400; }
      .tool[open] > summary::before { content: "🔧 ▾"; }
      .tool[open] > summary { border-bottom: 1px solid var(--composer-border); }
      .tool-row { padding: 8px 14px; }
      .tool-row + .tool-row { border-top: 1px solid var(--composer-border); }
      .tool-name {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }
      .tool-name::before { content: "🔧"; }
      .tool-args,
      .tool-result {
        margin-top: 4px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .tool-result.pending { font-style: italic; }

      footer {
        flex-shrink: 0;
        background: var(--bg);
      }
      body.chatting footer {
        padding: 8px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      /* The composer card — used in both the empty stage and the footer. */
      .composer {
        width: min(820px, 100%);
        margin: 0 auto;
        background: var(--composer-bg);
        border: 1px solid var(--composer-border);
        border-radius: 26px;
        padding: 8px 8px 8px 18px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .composer textarea {
        width: 100%;
        resize: none;
        background: transparent;
        color: var(--text);
        border: none;
        padding: 10px 8px 4px;
        font-family: inherit;
        /* 16px keeps iOS Safari from auto-zooming when the field is focused. */
        font-size: 16px;
        line-height: 1.5;
        min-height: 44px;
        max-height: 220px;
        outline: none;
        caret-color: var(--accent);
      }
      .composer textarea::placeholder { color: var(--muted); }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toolbar .spacer { flex: 1; }

      /* Round icon buttons. */
      .icon-btn {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--composer-border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        padding: 0;
        touch-action: manipulation;
      }
      .icon-btn:active { transform: scale(0.96); }

      .send-btn {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: var(--send-bg);
        color: #fff;
        cursor: pointer;
        padding: 0;
        transition: background 0.15s ease;
        touch-action: manipulation;
      }
      .send-btn.ready { background: var(--send-bg-active); color: var(--accent-text); }
      .send-btn:disabled { cursor: default; opacity: 0.6; }
      .send-btn:active { transform: scale(0.96); }

      /* Model badge. */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 60%;
        padding: 5px 10px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--composer-border);
        font-size: 13px;
      }
      .badge .cube { color: var(--text); display: inline-flex; }
      .badge .bname { font-weight: 700; }
      .badge .pill {
        padding: 1px 7px;
        border-radius: 7px;
        background: var(--pill-bg);
        border: 1px solid var(--pill-border);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body class="empty">
    <aside id="sidebar">
      <button id="newChat">+ New chat</button>
      <div id="convList"></div>
    </aside>
    <button id="sidebarToggle" aria-label="Toggle chats">☰</button>
    <div id="content">
    <main id="scroller">
      <div class="stage" id="stage">
        <div id="hero">
          <h1>Hey, <span class="accent">Tomas</span></h1>
        </div>

        <!-- The composer lives here while empty; JS relocates it to <footer>
             once the first message is sent. -->
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask TORA anything…" autofocus></textarea>
          <div class="toolbar">
            <button class="icon-btn" id="plus" title="Upload files" aria-label="Upload files">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
            <span class="spacer"></span>
            <span class="badge" id="modelBadge" style="display:none"></span>
            <button class="send-btn" id="send" title="Send" aria-label="Send" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="6" /><polyline points="6 12 12 6 18 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div id="messages"></div>
    </main>

    <footer id="footer"></footer>
    </div>

    <script>
      const bodyEl = document.body;
      const scrollerEl = document.getElementById("scroller");
      const messagesEl = document.getElementById("messages");
      const footerEl = document.getElementById("footer");
      const composerEl = document.getElementById("composer");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const plusBtn = document.getElementById("plus");
      const modelBadge = document.getElementById("modelBadge");
      const convListEl = document.getElementById("convList");
      const newChatBtn = document.getElementById("newChat");
      const sidebarToggle = document.getElementById("sidebarToggle");
      const stageEl = document.getElementById("stage");

      // The backend owns history; the frontend tracks only the current chat id.
      let currentConversationId = null;

      function scrollToBottom() {
        scrollerEl.scrollTop = scrollerEl.scrollHeight;
      }

      // --- Model badge ----------------------------------------------------
      // Parse a gguf-style model id (e.g. "gemma-3-27b-it-UD-Q8_K_XL.gguf")
      // into a bold family name plus a row of monospace pills.
      const esc = (s) => s.replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      function renderBadge(id) {
        const base = (id || "").split("/").pop().trim();
        if (!base || base === "unknown") return;

        const tokens = base.split("-");
        const nameTokens = [tokens.shift()];
        // Fold a trailing pure-number version into the bold name ("gemma" + "3").
        if (tokens.length && /^\d+$/.test(tokens[0])) nameTokens.push(tokens.shift());

        const cube =
          '<span class="cube"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" ' +
          'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73' +
          'l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><polyline points="3.27 6.96 12 12.01 20.73 6.96" />' +
          '<line x1="12" y1="22.08" x2="12" y2="12" /></svg></span>';

        modelBadge.innerHTML =
          cube +
          '<span class="bname">' + esc(nameTokens.join("-")) + "</span>" +
          tokens.map((t) => '<span class="pill">' + esc(t) + "</span>").join("");
        modelBadge.style.display = "inline-flex";
      }

      fetch("/api/model")
        .then((r) => r.json())
        .then((d) => renderBadge(d.id))
        .catch(() => {});

      // --- Markdown rendering ---------------------------------------------
      // A small, dependency-free renderer (no CDN — the app is self-hosted).
      // It escapes HTML *first*, then applies a limited set of markdown rules,
      // so model output can never inject scripts/markup (XSS-safe).
      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function renderInline(s) {
        // `s` is already HTML-escaped.
        return s
          .replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
          // links: only http(s) (never javascript:), no quotes in the URL.
          .replace(
            /\[([^\]]+)\]\((https?:\/\/[^\s)"]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
          );
      }
      function isTableSep(l) {
        return /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(l);
      }
      function splitRow(l) {
        let t = l.trim();
        if (t.startsWith("|")) t = t.slice(1);
        if (t.endsWith("|")) t = t.slice(0, -1);
        return t.split("|").map((c) => c.trim());
      }
      function isBlockStart(l, next) {
        return (
          /^\s*```/.test(l) ||
          /^#{1,6}\s+/.test(l) ||
          /^\s*[-*+]\s+/.test(l) ||
          /^\s*\d+\.\s+/.test(l) ||
          (l.includes("|") && next !== undefined && isTableSep(next))
        );
      }
      function renderMarkdown(src) {
        const lines = src.replace(/\r\n?/g, "\n").split("\n");
        let html = "";
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) { i++; continue; }

          // fenced code block
          if (/^\s*```/.test(line)) {
            i++;
            const code = [];
            while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
            i++; // closing fence
            html += "<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>";
            continue;
          }
          // heading
          const h = line.match(/^(#{1,6})\s+(.*)$/);
          if (h) {
            const n = h[1].length;
            html += "<h" + n + ">" + renderInline(escapeHtml(h[2].trim())) + "</h" + n + ">";
            i++;
            continue;
          }
          // table
          if (line.includes("|") && isTableSep(lines[i + 1] || "")) {
            const header = splitRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
              rows.push(splitRow(lines[i++]));
            }
            let t = "<table><thead><tr>";
            for (const c of header) t += "<th>" + renderInline(escapeHtml(c)) + "</th>";
            t += "</tr></thead><tbody>";
            for (const r of rows) {
              t += "<tr>";
              for (let k = 0; k < header.length; k++) {
                t += "<td>" + renderInline(escapeHtml(r[k] || "")) + "</td>";
              }
              t += "</tr>";
            }
            html += t + "</tbody></table>";
            continue;
          }
          // unordered / ordered list
          const ul = /^\s*[-*+]\s+/, ol = /^\s*\d+\.\s+/;
          if (ul.test(line) || ol.test(line)) {
            const ordered = ol.test(line);
            const re = ordered ? ol : ul;
            const items = [];
            while (i < lines.length && re.test(lines[i])) {
              items.push(renderInline(escapeHtml(lines[i].replace(re, ""))));
              i++;
            }
            const tag = ordered ? "ol" : "ul";
            html += "<" + tag + "><li>" + items.join("</li><li>") + "</li></" + tag + ">";
            continue;
          }
          // paragraph (consecutive lines until a blank line or a new block)
          const para = [];
          while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i], lines[i + 1])) {
            para.push(renderInline(escapeHtml(lines[i])));
            i++;
          }
          html += "<p>" + para.join("<br>") + "</p>";
        }
        return html;
      }

      // --- Message rendering ----------------------------------------------
      function addBubble(role, text) {
        const msg = document.createElement("div");
        msg.className = "msg " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msg.appendChild(bubble);
        messagesEl.appendChild(msg);
        scrollToBottom();
        return bubble;
      }

      // Assistant turn: a column holding an optional (lazily created) collapsible
      // reasoning block above the answer bubble.
      function addAssistant() {
        const msg = document.createElement("div");
        msg.className = "msg assistant";
        const bubble = document.createElement("div");
        bubble.className = "bubble thinking";
        bubble.textContent = "…";
        msg.appendChild(bubble);
        messagesEl.appendChild(msg);
        scrollToBottom();

        let reasoningBody = null;
        function appendThinking(text) {
          if (!reasoningBody) {
            const details = document.createElement("details");
            details.className = "reasoning";
            details.open = false; // collapsed by default
            const summary = document.createElement("summary");
            summary.textContent = "Thinking";
            reasoningBody = document.createElement("div");
            reasoningBody.className = "body";
            details.appendChild(summary);
            details.appendChild(reasoningBody);
            msg.insertBefore(details, bubble); // above the answer
          }
          reasoningBody.textContent += text;
        }
        return { bubble, appendThinking };
      }

      // Render a card for the tools being called. Returns a map of
      // call id -> result element, so each result can be filled in on arrival.
      function addToolCard(calls) {
        const card = document.createElement("details");
        card.className = "tool"; // collapsed by default (no `open` attribute)
        const summary = document.createElement("summary");
        summary.textContent = calls.map((c) => c.name).join(", ");
        card.appendChild(summary);
        const resultEls = {};
        for (const c of calls) {
          const row = document.createElement("div");
          row.className = "tool-row";

          const name = document.createElement("div");
          name.className = "tool-name";
          name.textContent = c.name;

          const args = document.createElement("div");
          args.className = "tool-args";
          args.textContent = c.arguments;

          const result = document.createElement("div");
          result.className = "tool-result pending";
          result.textContent = "running…";

          row.append(name, args, result);
          card.appendChild(row);
          resultEls[c.id] = result;
        }
        messagesEl.appendChild(card);
        scrollToBottom();
        return resultEls;
      }

      // --- Composer behaviour ---------------------------------------------
      function autosize() {
        inputEl.style.height = "auto";
        inputEl.style.height = inputEl.scrollHeight + "px";
      }
      function refreshSendState() {
        const ready = inputEl.value.trim().length > 0;
        sendBtn.disabled = !ready;
        sendBtn.classList.toggle("ready", ready);
      }
      inputEl.addEventListener("input", () => {
        autosize();
        refreshSendState();
      });

      // Placeholder upload affordance — opens a file picker. The backend has no
      // file support yet, so this is wired up but intentionally a no-op.
      plusBtn.addEventListener("click", () => {
        const picker = document.createElement("input");
        picker.type = "file";
        picker.multiple = true;
        picker.click();
      });

      let movedComposer = false;
      function enterChatMode() {
        if (movedComposer) return;
        movedComposer = true;
        bodyEl.classList.remove("empty");
        bodyEl.classList.add("chatting");
        footerEl.appendChild(composerEl); // relocate from the centered stage
        inputEl.focus();
      }

      // --- Conversations (backend-owned history) --------------------------
      function closeSidebarMobile() {
        bodyEl.classList.remove("sidebar-open");
      }

      // Unix seconds -> short local date+time, e.g. "Jun 2, 10:49 AM".
      function formatWhen(ts) {
        return new Date(ts * 1000).toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      async function loadConversationList() {
        const list = await fetch("/api/conversations")
          .then((r) => r.json())
          .catch(() => []);
        convListEl.innerHTML = "";
        for (const c of list) {
          const row = document.createElement("div");
          row.className = "conv" + (c.id === currentConversationId ? " active" : "");

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.addEventListener("click", () => openConversation(c.id));

          const t = document.createElement("div");
          t.className = "t";
          t.textContent = c.title || "New chat";

          const when = document.createElement("div");
          when.className = "when";
          when.textContent = formatWhen(c.created_at);

          meta.append(t, when);

          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "🗑";
          del.title = "Delete chat";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteConversation(c.id);
          });

          row.append(meta, del);
          convListEl.appendChild(row);
        }
      }

      async function ensureConversation() {
        if (currentConversationId) return;
        const d = await fetch("/api/conversations", { method: "POST" }).then((r) => r.json());
        currentConversationId = d.id;
        localStorage.setItem("tora.cid", d.id);
      }

      function newChat() {
        currentConversationId = null;
        localStorage.removeItem("tora.cid");
        messagesEl.innerHTML = "";
        bodyEl.classList.remove("chatting");
        bodyEl.classList.add("empty");
        if (movedComposer) {
          stageEl.appendChild(composerEl); // move the composer back to center
          movedComposer = false;
        }
        loadConversationList();
        closeSidebarMobile();
        inputEl.focus();
      }

      async function openConversation(id) {
        const res = await fetch("/api/conversations/" + id);
        if (!res.ok) {
          localStorage.removeItem("tora.cid"); // stale id (e.g. deleted)
          return;
        }
        const data = await res.json();
        currentConversationId = id;
        localStorage.setItem("tora.cid", id);
        messagesEl.innerHTML = "";
        enterChatMode();
        renderMessages(data.messages);
        loadConversationList(); // refresh active highlight
        closeSidebarMobile();
      }

      async function deleteConversation(id) {
        await fetch("/api/conversations/" + id, { method: "DELETE" });
        if (id === currentConversationId) newChat();
        else loadConversationList();
      }

      // Render a stored conversation: pair each assistant tool_call with its
      // tool result (from the `tool` messages) so the cards show their output.
      function renderMessages(messages) {
        const toolResults = {};
        for (const m of messages) {
          if (m.role === "tool") toolResults[m.tool_call_id] = m.content;
        }
        for (const m of messages) {
          if (m.role === "user") {
            addBubble("user", m.content || "");
          } else if (m.role === "assistant") {
            if (m.content) {
              const b = addBubble("assistant", "");
              b.classList.add("md");
              b.innerHTML = renderMarkdown(m.content);
            }
            if (m.tool_calls && m.tool_calls.length) {
              const calls = m.tool_calls.map((tc) => ({
                id: tc.id,
                name: tc.function.name,
                arguments: tc.function.arguments,
              }));
              const els = addToolCard(calls);
              for (const c of calls) {
                if (els[c.id] && toolResults[c.id] !== undefined) {
                  els[c.id].textContent = toolResults[c.id];
                  els[c.id].classList.remove("pending");
                }
              }
            }
          }
        }
        scrollToBottom();
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;

        enterChatMode();

        inputEl.value = "";
        autosize();
        refreshSendState();
        sendBtn.disabled = true;

        await ensureConversation();

        addBubble("user", text);

        // A response can span several turns (text, a tool call, more text…).
        // `cur` is the assistant bubble for the current turn; `reply` its text.
        let cur = addAssistant();
        let reply = "";
        const toolResultEls = {}; // call id -> result element, across rounds

        // Tidy the current assistant bubble: drop the spinner, or hide it if the
        // turn produced no text (e.g. it only made a tool call).
        function closeBubble() {
          if (reply) cur.bubble.classList.remove("thinking");
          else cur.bubble.style.display = "none";
        }

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              conversation_id: currentConversationId,
              message: { role: "user", content: text },
            }),
          });
          if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";

          function handle(line) {
            if (!line.trim()) return;
            const evt = JSON.parse(line);
            if (evt.type === "thinking") {
              cur.appendThinking(evt.text);
            } else if (evt.type === "content") {
              if (reply === "") cur.bubble.classList.remove("thinking");
              reply += evt.text;
              cur.bubble.classList.add("md");
              cur.bubble.innerHTML = renderMarkdown(reply);
            } else if (evt.type === "tool_call") {
              // This turn requested tools: show the card, then open a fresh
              // assistant turn for the model's next round.
              closeBubble();
              Object.assign(toolResultEls, addToolCard(evt.calls));
              cur = addAssistant();
              reply = "";
            } else if (evt.type === "tool_result") {
              const el = toolResultEls[evt.id];
              if (el) {
                el.textContent = evt.text;
                el.classList.remove("pending");
              }
            }
            scrollToBottom();
          }

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop(); // keep the trailing partial line
            for (const line of lines) handle(line);
          }
          if (buf) handle(buf); // flush any remaining line

          closeBubble(); // tidy the final assistant turn
          loadConversationList(); // title/order may have changed (backend saved)
        } catch (err) {
          cur.bubble.classList.remove("thinking");
          cur.bubble.style.display = "";
          cur.bubble.textContent = "⚠️ " + err.message;
        }

        refreshSendState();
        inputEl.focus();
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      newChatBtn.addEventListener("click", newChat);
      sidebarToggle.addEventListener("click", () =>
        bodyEl.classList.toggle("sidebar-open")
      );

      // On load: populate the sidebar and resume the last conversation, if any.
      loadConversationList();
      const savedId = localStorage.getItem("tora.cid");
      if (savedId) openConversation(savedId);

      // iOS Safari doesn't resize the layout when the keyboard opens — it just
      // shrinks the visual viewport and scrolls. Pin the body to the visible
      // height so the composer stays above the keyboard, and keep chat pinned
      // to the bottom.
      const vv = window.visualViewport;
      if (vv) {
        const fit = () => {
          document.body.style.height = vv.height + "px";
          if (bodyEl.classList.contains("chatting")) scrollToBottom();
        };
        vv.addEventListener("resize", fit);
        vv.addEventListener("scroll", fit);
        fit();
      }
    </script>
  </body>
</html>
