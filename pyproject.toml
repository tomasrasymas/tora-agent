[project]
name = "tora-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.104.1",
    "fastapi>=0.136.3",
    "openai>=2.38.0",
    "python-dotenv>=1.0.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
tora = "tora.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tora"]
